<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weerwolven Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --text-color: #e0e0e0;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --status-levend: #4ade80;
            --status-dood: #f87171;
            --stem-bg: #282318;
            --stem-border: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
            color: #ffffff;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .file-inputs {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .file-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85em;
            color: #aaa;
        }

        input[type="file"], select {
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 6px;
            background: #2a2a2a;
            border: none;
            color: #fff;
            font-weight: 500;
        }

        .tab.active {
            background: var(--accent-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #2a2a2a;
            color: #aaa;
        }

        .status-levend {
            color: var(--status-levend);
            font-weight: bold;
        }

        .status-dood {
            color: var(--status-dood);
            font-weight: bold;
        }

        .chat-box {
            max-height: 550px;
            overflow-y: auto;
            background: #181818;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .chat-msg {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            background: #222;
        }

        .chat-msg .author {
            font-weight: bold;
            color: #60a5fa;
            margin-right: 8px;
        }

        .chat-msg .time {
            font-size: 0.8em;
            color: #888;
            float: right;
        }

        .chat-msg.is-stem {
            border-left: 4px solid var(--stem-border);
            background: var(--stem-bg);
        }

        .person-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .person-item {
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🐺 WhatsApp Weerwolven Dashboard</h1>

    <div class="card">
        <div class="file-inputs">
            <div class="file-group">
                <label>1. Chat Bestand (_chat.txt)</label>
                <input type="file" id="chatFileInput" accept=".txt">
            </div>
            <div class="file-group">
                <label>2. Naam Mappings (naam_mappings.json)</label>
                <input type="file" id="mappingFileInput" accept=".json">
            </div>
            <div class="file-group">
                <label>3. Spelers Status (spelers_status.json)</label>
                <input type="file" id="statusFileInput" accept=".json">
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('spelerlijst')">Spelerlijst</button>
        <button class="tab" onclick="switchTab('chat')">Chatgegevens</button>
    </div>

    <!-- TAB 1: SPELERLIJST -->
    <div id="spelerlijst" class="tab-content active">
        <div class="card">
            <h2>Spelersoverzicht</h2>
            <table>
                <thead>
                    <tr>
                        <th>Speler</th>
                        <th>Status</th>
                        <th>Rol</th>
                    </tr>
                </thead>
                <tbody id="spelerTabelBody">
                    <tr><td colspan="3" style="text-align: center; color: #888;">Laad de bestanden in om gegevens te tonen.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- TAB 2: CHATGEGEVENS -->
    <div id="chat" class="tab-content">
        <div class="card">
            <h2>Chat & Filter</h2>
            <div class="filters">
                <div>
                    <label>Datum:</label>
                    <select id="datumSelect" onchange="renderChatData()"></select>
                </div>
            </div>
            
            <label>Spelers in de chat:</label>
            <div id="personenLijst" class="person-list"></div>
        </div>

        <div class="card">
            <div class="chat-box" id="chatContainer">
                <div style="text-align: center; color: #888;">Geen chatberichten geladen.</div>
            </div>
        </div>
    </div>
</div>

<script>
    let naamMappings = {};
    let spelersStatusRaw = {};
    let spelersStatus = {};
    let rawChatText = "";
    let globalChatData = { berichten: [], personen: [], datums: [] };

    // File input event listeners
    document.getElementById('mappingFileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            const text = await file.text();
            naamMappings = JSON.parse(text);
            updateAlles();
        }
    });

    document.getElementById('statusFileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            const text = await file.text();
            spelersStatusRaw = JSON.parse(text);
            updateAlles();
        }
    });

    document.getElementById('chatFileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            rawChatText = await file.text();
            updateAlles();
        }
    });

    // Herbereken en verwerk status keys via de mapping
    function verwerkSpelersStatus() {
        spelersStatus = {};
        for (const [ruweNaam, data] of Object.entries(spelersStatusRaw)) {
            // Vertaal de ruwe sleutel uit spelers_status.json naar de opgeschoonde naam via naam_mappings.json
            const schoneNaam = naamMappings[ruweNaam] || ruweNaam;
            spelersStatus[schoneNaam] = data;
        }
    }

    function updateAlles() {
        verwerkSpelersStatus();
        if (rawChatText) {
            verwerkChatInBrowser(rawChatText);
        } else {
            renderSpelersTabel();
        }
    }

    function verwerkChatInBrowser(rawText) {
        const regels = rawText.split('\n');
        const berichtPatroon = /^\[(\d{2}-\d{2}-\d{4}),\s(\d{2}:\d{2}:\d{2})\]\s([^:]+):\s/;

        let berichten = [], personenSet = new Set(), datumsSet = new Set(), huidigBericht = null;
        const negeer = ["toegevoegd", "gewijzigd", "gemaakt", "versleuteld", "beheerder"];

        regels.forEach(regel => {
            const schoon = regel.replace(/[\u200e\ufeff]/g, '');
            const match = schoon.match(berichtPatroon);

            if (match) {
                if (huidigBericht) berichten.push(huidigBericht);
                const datum = match[1], tijd = match[2];
                const ruweNaam = match[3].replace('~', '').trim();
                
                // Omzetten van ruwe WhatsApp-afzender naar schone weergavenaam
                const persoon = naamMappings[ruweNaam] || ruweNaam;

                if (negeer.some(s => schoon.includes(s))) { huidigBericht = null; return; }

                personenSet.add(persoon);
                datumsSet.add(datum);
                huidigBericht = { datum, tijd, persoon, tekst: schoon.substring(match[0].length).trim() };
            } else if (huidigBericht) {
                huidigBericht.tekst += "\n" + schoon.trim();
            }
        });
        if (huidigBericht) berichten.push(huidigBericht);

        const personen = Array.from(personenSet).sort();

        // Als een speler uit de chat niet in spelers_status staat, toevoegen met default status
        personen.forEach(p => {
            if (!spelersStatus[p]) {
                spelersStatus[p] = { status: "levend", rol: "Onbekend" };
            }
        });

        berichten.forEach(b => {
            const t = b.tekst.toLowerCase();
            b.is_stem = t.includes("ik stem") || t.includes("stem op") || personen.some(p => new RegExp('\\bstem ' + p.toLowerCase() + '\\b').test(t));
        });

        globalChatData = { berichten, personen, datums: Array.from(datumsSet) };
        
        const datumSelect = document.getElementById('datumSelect');
        datumSelect.innerHTML = '<option value="alle">Alle Dagen</option>';
        globalChatData.datums.forEach(d => datumSelect.innerHTML += `<option value="${d}">${d}</option>`);

        renderSpelersTabel();
        renderPersonenLijst();
        renderChatData();
    }

    function renderSpelersTabel() {
        const tbody = document.getElementById('spelerTabelBody');
        const keys = Object.keys(spelersStatus);

        if (keys.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">Geen spelers geladen.</td></tr>';
            return;
        }
        
        tbody.innerHTML = keys.map(p => {
            const st = spelersStatus[p] || {};
            const rawStatus = (st.status || 'levend').toLowerCase();
            const isLevend = rawStatus === "levend";
            const rolTekst = (st.rol && st.rol.trim() !== "") ? st.rol : "Onbekend";

            return `
            <tr>
                <td><b>${p}</b></td>
                <td class="${isLevend ? 'status-levend' : 'status-dood'}">${rawStatus.toUpperCase()}</td>
                <td>${rolTekst}</td>
            </tr>`;
        }).join('');
    }

    function renderPersonenLijst() {
        const container = document.getElementById('personenLijst');
        container.innerHTML = globalChatData.personen.map(p => `
            <div class="person-item">
                <input type="checkbox" checked value="${p}" id="chk_${p}" onchange="renderChatData()">
                <label for="chk_${p}">${p}</label>
            </div>
        `).join('');
    }

    function renderChatData() {
        const container = document.getElementById('chatContainer');
        const gekozenDatum = document.getElementById('datumSelect').value;
        
        const actievePersonen = Array.from(document.querySelectorAll('#personenLijst input:checked')).map(cb => cb.value);

        const gefilterdeBerichten = globalChatData.berichten.filter(b => {
            const datumMatch = (gekozenDatum === 'alle' || b.datum === gekozenDatum);
            const persoonMatch = actievePersonen.includes(b.persoon);
            return datumMatch && persoonMatch;
        });

        if (gefilterdeBerichten.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: #888;">Geen berichten gevonden voor deze selectie.</div>';
            return;
        }

        container.innerHTML = gefilterdeBerichten.map(b => `
            <div class="chat-msg ${b.is_stem ? 'is-stem' : ''}">
                <span class="time">${b.datum} ${b.tijd}</span>
                <span class="author">${b.persoon}:</span>
                <span>${escapeHtml(b.tekst)}</span>
            </div>
        `).join('');
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
    }
</script>

</body>
</html>

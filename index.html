<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wakkerdam - Het Dorp</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: rgba(22, 27, 34, 0.9);
            --border-gold: #c9a050;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --accent-red: #8b0000;
            --status-levend: #4ade80;
            --status-dood: #f87171;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg-dark) url('https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .overlay {
            background: rgba(10, 12, 16, 0.85);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(15, 15, 20, 0.95);
            border-bottom: 2px solid var(--border-gold);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 3px;
            color: var(--border-gold);
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #1a1e24;
            color: var(--text-main);
            border: 1px solid var(--border-gold);
            padding: 10px 20px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.6);
        }

        main {
            flex-grow: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .tab-content {
            display: none;
            background: var(--panel-bg);
            border: 1px solid rgba(201, 160, 80, 0.3);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tab-content.active {
            display: block;
        }

        /* Courant Styles - Volledige hoogte zonder interne of externe iframe scrollbar */
        .courant-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.4);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        select, input {
            background: #12151a;
            color: var(--border-gold);
            border: 1px solid var(--border-gold);
            padding: 8px 12px;
            font-family: inherit;
            border-radius: 4px;
        }

        .courant-frame {
            width: 100%;
            border: 1px solid var(--border-gold);
            border-radius: 4px;
            background: #fff;
            display: block;
            overflow: hidden;
        }

        /* Chat Dashboard Layout met werkende scrollbars op de panelen */
        .chat-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .time-filter {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--border-gold);
        }

        .grid {
            display: grid;
            grid-template-columns: 240px 200px 1fr;
            gap: 15px;
            height: 650px;
        }

        .panel {
            background: #12151a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }

        .panel h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .scrollable {
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
        }

        /* Compactere berichtkaartjes */
        .msg-item {
            background: #1a1e24;
            padding: 6px 10px;
            margin-bottom: 4px;
            border-radius: 4px;
            border-left: 3px solid var(--border-gold);
            white-space: pre-wrap;
            font-family: sans-serif;
            font-size: 0.88rem;
            line-height: 1.35;
        }

        .stem-tag { color: #ff5555; font-weight: bold; }

        /* Status Tabel */
        table.status-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table.status-table th, table.status-table td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-family: sans-serif;
            font-size: 0.9rem;
        }

        table.status-table th {
            background: rgba(0,0,0,0.5);
            color: var(--border-gold);
        }

        .status-levend { color: var(--status-levend); font-weight: bold; }
        .status-dood { color: var(--status-dood); font-weight: bold; }
    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <h1>Wakkerdam Archief</h1>
            <nav>
                <button class="tab-btn active" onclick="openTab('courant')">Dagelijkse Courant</button>
                <button class="tab-btn" onclick="openTab('chat')">Chatgegevens</button>
                <button class="tab-btn" onclick="openTab('spelers')">Spelerlijst</button>
            </nav>
        </header>

        <main>
            <!-- TAB 1: DAGELIJKSE COURANT -->
            <section id="courant" class="tab-content active">
                <h2>De Dagelijkse Courant</h2>
                <div class="courant-controls">
                    <label for="courantSelect">Kies editie:</label>
                    <select id="courantSelect" onchange="laadCourant(this.value)">
                        <option>Scannen...</option>
                    </select>
                </div>
                <iframe id="courantViewer" class="courant-frame" src="" scrolling="no" onload="adjustIframeHeight(this)"></iframe>
            </section>

            <!-- TAB 2: CHATGEGEVENS -->
            <section id="chat" class="tab-content">
                <h2>Chatanalyse</h2>
                <div class="chat-controls">
                    <select id="modusSelect" onchange="renderChatData()">
                        <option value="berichten" selected>Alle Berichten</option>
                        <option value="stemmen">Alle Stemmen</option>
                    </select>
                    <input type="text" id="zoekBalk" placeholder="Zoek in berichten..." oninput="renderChatData()">
                    <select id="datumSelect" onchange="renderChatData()">
                        <option value="alle">Alle Dagen</option>
                    </select>

                    <div class="time-filter">
                        <label>Van:</label>
                        <input type="time" id="tijdVan" value="00:00" onchange="renderChatData()">
                        <label>Tot:</label>
                        <input type="time" id="tijdTot" value="23:59" onchange="renderChatData()">
                    </div>

                    <span id="chatStatus" style="margin-left: auto; color: #8b949e;">Laden...</span>
                </div>

                <div class="grid">
                    <div class="panel">
                        <h3>Personen (<span id="ledenAantal">0</span>)</h3>
                        <div class="scrollable" id="personenLijst"></div>
                    </div>
                    <div class="panel">
                        <h3>Aantal Berichten</h3>
                        <div class="scrollable" id="aantalBerichtenLijst"></div>
                    </div>
                    <div class="panel">
                        <h3 id="resultaatTitel">RESULTATEN</h3>
                        <div class="scrollable" id="resultatenLijst"></div>
                    </div>
                </div>
            </section>

            <!-- TAB 3: SPELERLIJST -->
            <section id="spelers" class="tab-content">
                <h2>Spelerlijst</h2>
                <p style="color: var(--text-muted);">Status van alle deelnemers.</p>
                <table class="status-table">
                    <thead>
                        <tr>
                            <th>Speler</th>
                            <th>Status</th>
                            <th>Rol</th>
                        </tr>
                    </thead>
                    <tbody id="spelerLijstTabel">
                        <tr><td colspan="3" style="color: var(--text-muted);">Laden...</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        let naamMappings = {};
        let spelersStatus = {};
        let globalChatData = { berichten: [], personen: [], datums: [] };

        // --- TAB ROUTING ---
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');

            if (tabId === 'courant') {
                const viewer = document.getElementById('courantViewer');
                adjustIframeHeight(viewer);
            }
        }

        // --- COURANT LADER & EXACTE HOOGTE METING ---
        async function initCourantDirectory() {
            const select = document.getElementById('courantSelect');
            select.innerHTML = '<option>Scannen naar couranten...</option>';

            const gevondenCouranten = [];
            const maxSpellen = 25;
            const maxEdities = 10;
            const scanBeloftes = [];

            for (let spel = 1; spel <= maxSpellen; spel++) {
                for (let editie = 1; editie <= maxEdities; editie++) {
                    const fileName = `Courant_${spel}.${editie}.html`;
                    const filePath = `couranten/${fileName}`;

                    const check = fetch(filePath)
                        .then(response => {
                            if (response.ok) {
                                gevondenCouranten.push({ spel, editie, file: fileName });
                            }
                        })
                        .catch(() => {});

                    scanBeloftes.push(check);
                }
            }

            await Promise.all(scanBeloftes);
            select.innerHTML = '';

            if (gevondenCouranten.length === 0) {
                select.innerHTML = '<option>Geen couranten gevonden in /couranten/</option>';
                return;
            }

            gevondenCouranten.sort((a, b) => (b.spel - a.spel) || (b.editie - a.editie));

            gevondenCouranten.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.file;
                opt.innerText = `Spel ${item.spel} - Editie ${item.editie} (${item.file})`;
                select.appendChild(opt);
            });

            laadCourant(gevondenCouranten[0].file);
        }

        function laadCourant(fileName) {
            if (fileName) {
                const viewer = document.getElementById('courantViewer');
                viewer.src = `couranten/${fileName}`;
            }
        }

        function adjustIframeHeight(iframe) {
            try {
                if (iframe.contentWindow && iframe.contentWindow.document.body) {
                    const doc = iframe.contentWindow.document;
                    const height = Math.max(
                        doc.body.scrollHeight,
                        doc.documentElement.scrollHeight,
                        doc.body.offsetHeight,
                        doc.documentElement.offsetHeight
                    );
                    iframe.style.height = (height + 20) + 'px';
                }
            } catch (e) {
                iframe.style.height = '1500px';
            }
        }

        // --- CHAT & DATA ANALYSER ---
        async function initChat() {
            try {
                const [chatRes, mappingRes, statusRes] = await Promise.all([
                    fetch('_chat.txt'),
                    fetch('naam_mappings.json'),
                    fetch('spelers_status.json')
                ]);

                if (mappingRes.ok) naamMappings = await mappingRes.json();
                if (statusRes.ok) spelersStatus = await statusRes.json();

                renderSpelerLijst();

                if (!chatRes.ok) throw new Error("_chat.txt niet gevonden");
                const chatText = await chatRes.text();
                verwerkChatInBrowser(chatText);
                document.getElementById('chatStatus').innerText = "Actief: _chat.txt";
            } catch (err) {
                document.getElementById('chatStatus').innerText = err.message;
                document.getElementById('chatStatus').style.color = "red";
                renderSpelerLijst();
            }
        }

        function verwerkChatInBrowser(rawText) {
            const regels = rawText.split('\n');
            const berichtPatroon = /^\[(\d{2}-\d{2}-\d{4}),\s(\d{2}:\d{2}:\d{2})\]\s([^:]+):\s/;

            let berichten = [], personenSet = new Set(), datumsSet = new Set(), huidigBericht = null;
            const negeer = ["toegevoegd", "gewijzigd", "gemaakt", "versleuteld", "beheerder"];

            regels.forEach(regel => {
                const schoon = regel.replace(/[\u200e\ufeff]/g, '');
                const match = schoon.match(berichtPatroon);

                if (match) {
                    if (huidigBericht) {
                        huidigBericht.tekst = opruimenTekst(huidigBericht.tekst);
                        berichten.push(huidigBericht);
                    }
                    const datum = match[1], tijd = match[2];
                    const ruweNaam = match[3].replace('~', '').trim();
                    const persoon = naamMappings[ruweNaam] || ruweNaam;

                    if (negeer.some(s => schoon.includes(s))) { huidigBericht = null; return; }
                    const tekst = schoon.substring(match[0].length).trim();

                    personenSet.add(persoon); datumsSet.add(datum);
                    huidigBericht = { datum, tijd, persoon, tekst };
                } else if (huidigBericht) {
                    huidigBericht.tekst += "\n" + schoon.trim();
                }
            });
            
            if (huidigBericht) {
                huidigBericht.tekst = opruimenTekst(huidigBericht.tekst);
                berichten.push(huidigBericht);
            }

            const personen = Array.from(personenSet).sort();
            berichten.forEach(b => {
                const t = b.tekst.toLowerCase();
                b.is_stem = t.includes("ik stem") || t.includes("stem op") || personen.some(p => new RegExp('\\bstem ' + p.toLowerCase() + '\\b').test(t));
            });

            globalChatData = { berichten, personen, datums: Array.from(datumsSet) };
            
            const datumSelect = document.getElementById('datumSelect');
            datumSelect.innerHTML = '<option value="alle">Alle Dagen</option>';
            globalChatData.datums.forEach(d => datumSelect.innerHTML += `<option value="${d}">${d}</option>`);

            const personenContainer = document.getElementById('personenLijst');
            document.getElementById('ledenAantal').innerText = globalChatData.personen.length;
            personenContainer.innerHTML = globalChatData.personen.map(p => `
                <label style="display:block; margin-bottom: 5px; font-family: sans-serif; font-size: 0.85rem;">
                    <input type="checkbox" value="${p}" checked onchange="renderChatData()" class="persoon-check"> ${p}
                </label>
            `).join('');

            renderChatData();
        }

        // Verwijdert dubbele lege regels
        function opruimenTekst(tekst) {
            return tekst.replace(/\n\s*\n+/g, '\n').trim();
        }

        function renderChatData() {
            const modus = document.getElementById('modusSelect').value;
            const zoekterm = document.getElementById('zoekBalk').value.toLowerCase();
            const gekozenDatum = document.getElementById('datumSelect').value;
            const tijdVan = document.getElementById('tijdVan').value || "00:00";
            const tijdTot = document.getElementById('tijdTot').value || "23:59";

            const gecheckt = Array.from(document.querySelectorAll('.persoon-check:checked')).map(c => c.value);

            const gefilterd = globalChatData.berichten.filter(b => {
                const persoonMatch = gecheckt.includes(b.persoon);
                const datumMatch = (gekozenDatum === 'alle' || b.datum === gekozenDatum);
                const zoekMatch = (!zoekterm || b.tekst.toLowerCase().includes(zoekterm));
                
                const berichtTijd = b.tijd.substring(0, 5);
                const tijdMatch = (berichtTijd >= tijdVan && berichtTijd <= tijdTot);

                return persoonMatch && datumMatch && zoekMatch && tijdMatch;
            });

            const aantallen = {};
            gefilterd.forEach(b => aantallen[b.persoon] = (aantallen[b.persoon] || 0) + 1);
            document.getElementById('aantalBerichtenLijst').innerHTML = Object.entries(aantallen)
                .sort((a,b) => b[1] - a[1])
                .map(([p, count]) => `<div style="font-family: sans-serif; font-size: 0.85rem; margin-bottom: 4px;">• ${p}: <b>${count}</b></div>`).join('') || '(Geen data)';

            const resContainer = document.getElementById('resultatenLijst');
            const teTonen = modus === 'stemmen' ? gefilterd.filter(b => b.is_stem) : gefilterd;
            
            resContainer.innerHTML = teTonen.map(b => `
                <div class="msg-item">
                    <small>[${b.datum} ${b.tijd.substring(0,5)}]</small> <b>${b.persoon}</b> ${b.is_stem ? '<span class="stem-tag">[STEM]</span>' : ''}:<br>${escapeHtml(b.tekst)}
                </div>
            `).join('') || '(Geen resultaten)';
        }

        function renderSpelerLijst() {
            const tbody = document.getElementById('spelerLijstTabel');
            const keys = Object.keys(spelersStatus);

            if (keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color: var(--text-muted);">Geen spelerstatus geladen.</td></tr>';
                return;
            }

            tbody.innerHTML = keys.map(k => {
                const st = spelersStatus[k] || {};
                const weergaveNaam = naamMappings[k] || k;
                const rawStatus = (st.status || 'levend').toLowerCase();
                const isLevend = rawStatus === "levend";
                const rolTekst = (st.rol && st.rol.trim() !== "") ? st.rol : "Onbekend";

                return `
                <tr>
                    <td><b>${weergaveNaam}</b></td>
                    <td class="${isLevend ? 'status-levend' : 'status-dood'}">${rawStatus.toUpperCase()}</td>
                    <td>${rolTekst}</td>
                </tr>`;
            }).join('');
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        initCourantDirectory();
        initChat();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wakkerdam Archief</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: rgba(22, 27, 34, 0.95);
            --border-gold: #c9a050;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --accent-red: #8b0000;
            --accent-green: #2ea043;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg-dark) url('https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        .overlay {
            background: rgba(10, 12, 16, 0.85);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(15, 15, 20, 0.95);
            border-bottom: 2px solid var(--border-gold);
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: var(--border-gold);
            text-transform: uppercase;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .tab-btn {
            background: #1a1e24;
            color: var(--text-main);
            border: 1px solid var(--border-gold);
            padding: 8px 16px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
        }

        .tab-btn.active {
            background: var(--accent-red);
            color: #fff;
        }

        main {
            flex-grow: 1;
            padding: 15px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            height: calc(100vh - 110px);
            min-height: 0;
        }

        .tab-content {
            display: none;
            background: var(--panel-bg);
            border: 1px solid rgba(201, 160, 80, 0.3);
            border-radius: 8px;
            padding: 15px;
            height: 100%;
            box-sizing: border-box;
            min-height: 0;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Courant Frame */
        .courant-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid #333;
            flex-shrink: 0;
        }

        select, input {
            background: #12151a;
            color: var(--border-gold);
            border: 1px solid var(--border-gold);
            padding: 6px 10px;
            font-family: inherit;
            border-radius: 4px;
        }

        .courant-frame {
            width: 100%;
            flex-grow: 1;
            border: 1px solid var(--border-gold);
            border-radius: 4px;
            background: #fff;
        }

        /* Chat Layout & Scrollbars */
        .chat-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-grid {
            display: grid;
            grid-template-columns: 260px 240px 1fr;
            gap: 15px;
            flex-grow: 1;
            min-height: 0;
        }

        .panel {
            background: #12151a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 100%;
            box-sizing: border-box;
        }

        .panel h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: var(--border-gold);
            border-bottom: 1px solid #222;
            padding-bottom: 5px;
            flex-shrink: 0;
        }

        .scrollable-panel {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
            min-height: 0;
        }

        .scrollable-panel::-webkit-scrollbar { width: 6px; }
        .scrollable-panel::-webkit-scrollbar-thumb { background: var(--border-gold); border-radius: 3px; }

        .msg-item {
            background: #1a1e24;
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 4px;
            border-left: 3px solid var(--border-gold);
            white-space: pre-wrap;
            font-family: sans-serif;
            font-size: 0.85rem;
        }

        .stem-tag { color: #ff5555; font-weight: bold; }

        /* Spelers Tabel */
        .speler-tabel { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .speler-tabel th, .speler-tabel td { padding: 8px; text-align: left; border-bottom: 1px solid #222; font-size: 0.85rem; }
        .speler-tabel th { color: var(--border-gold); }
        .status-levend { color: var(--accent-green); font-weight: bold; }
        .status-dood { color: var(--accent-red); font-weight: bold; }

        .btn-small {
            padding: 4px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            background: #1a1e24;
            color: var(--border-gold);
            border: 1px solid var(--border-gold);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <h1>Wakkerdam Archief</h1>
            <nav>
                <button class="tab-btn active" onclick="openTab('courant')">Dagelijkse Courant</button>
                <button class="tab-btn" onclick="openTab('chat')">Chatgegevens</button>
                <button class="tab-btn" onclick="openTab('actief')">Spelerlijst</button>
            </nav>
        </header>

        <main>
            <!-- COURANT -->
            <section id="courant" class="tab-content active">
                <div class="courant-controls">
                    <label for="courantSelect">Selecteer editie:</label>
                    <select id="courantSelect" onchange="laadCourant(this.value)">
                        <option>Scannen...</option>
                    </select>
                </div>
                <iframe id="courantViewer" class="courant-frame" src=""></iframe>
            </section>

            <!-- CHATGEGEVENS -->
            <section id="chat" class="tab-content">
                <div class="chat-controls">
                    <select id="modusSelect" onchange="renderChatData()">
                        <option value="stemmen">Alle Stemmen</option>
                        <option value="berichten">Alle Berichten</option>
                    </select>
                    <input type="text" id="zoekBalk" placeholder="Zoek bericht..." oninput="renderChatData()">
                    <select id="datumSelect" onchange="renderChatData()"><option value="alle">Alle Dagen</option></select>
                    <button class="btn-small" onclick="selecteerAlleenLevend()">Alleen Levend</button>
                    <span id="chatStatus" style="margin-left: auto; color: #8b949e; font-size: 0.8rem;">Laden...</span>
                </div>

                <div class="chat-grid">
                    <div class="panel">
                        <h3>Spelers (<span id="ledenAantal">0</span>)</h3>
                        <div class="scrollable-panel" id="personenLijst"></div>
                    </div>
                    <div class="panel">
                        <h3>Aantal Berichten</h3>
                        <div class="scrollable-panel" id="aantalBerichtenLijst"></div>
                    </div>
                    <div class="panel">
                        <h3>Chatresultaten</h3>
                        <div class="scrollable-panel" id="resultatenLijst"></div>
                    </div>
                </div>
            </section>

            <!-- SPELERLIJST -->
            <section id="actief" class="tab-content">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
                    <h2 style="margin:0; color: var(--border-gold);">Spelerlijst</h2>
                    <button class="btn-small" onclick="exporteerStatusJSON()" style="background: var(--accent-red); color:#fff;">Exporteer Status JSON</button>
                </div>
                <p style="color: var(--text-muted); font-size: 0.85rem; flex-shrink:0;">Pas de status en rollen van spelers aan en exporteer naar <code>spelers_status.json</code> op GitHub.</p>
                
                <div class="scrollable-panel">
                    <table class="speler-tabel">
                        <thead>
                            <tr>
                                <th>Speler</th>
                                <th>Status</th>
                                <th>Rol</th>
                                <th>Rol Onthuld?</th>
                                <th>Acties</th>
                            </tr>
                        </thead>
                        <tbody id="spelerTabelBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        let naamMappings = {};
        let spelersStatus = {};
        let globalChatData = { berichten: [], personen: [], datums: [] };

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // --- COURANT SCANNER ---
        async function initCourantDirectory() {
            const select = document.getElementById('courantSelect');
            select.innerHTML = '<option>Scannen...</option>';
            const gevonden = [];
            const scanBeloftes = [];

            for (let spel = 1; spel <= 25; spel++) {
                for (let editie = 1; editie <= 10; editie++) {
                    const fileName = `Courant_${spel}.${editie}.html`;
                    const check = fetch(`couranten/${fileName}`, { method: 'HEAD' })
                        .then(res => { if (res.ok) gevonden.push({ spel, editie, file: fileName }); })
                        .catch(() => {});
                    scanBeloftes.push(check);
                }
            }

            await Promise.all(scanBeloftes);
            select.innerHTML = '';
            if (gevonden.length === 0) return select.innerHTML = '<option>Geen couranten</option>';

            gevonden.sort((a, b) => (b.spel - a.spel) || (b.editie - a.editie));
            gevonden.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.file;
                opt.innerText = `Spel ${item.spel} - Editie ${item.editie}`;
                select.appendChild(opt);
            });
            laadCourant(gevonden[0].file);
        }

        function laadCourant(file) {
            if (file) document.getElementById('courantViewer').src = `couranten/${file}`;
        }

        // --- BACKEND JSON & CHAT DATA ---
        async function initData() {
            // 1. Laad Naam Mappings
            try {
                const mapRes = await fetch('naam_mappings.json');
                if (mapRes.ok) naamMappings = await mapRes.json();
            } catch(e) {}

            // 2. Laad Spelers Status
            try {
                const statusRes = await fetch('spelers_status.json');
                if (statusRes.ok) spelersStatus = await statusRes.json();
            } catch(e) {}

            // 3. Laad Chat Log
            try {
                const chatRes = await fetch('_chat.txt');
                if (!chatRes.ok) throw new Error("_chat.txt niet gevonden");
                const chatText = await chatRes.text();
                verwerkChatInBrowser(chatText);
                document.getElementById('chatStatus').innerText = "Actief: _chat.txt";
            } catch (err) {
                document.getElementById('chatStatus').innerText = err.message;
                document.getElementById('chatStatus').style.color = "red";
            }
        }

        function verwerkChatInBrowser(rawText) {
            const regels = rawText.split('\n');
            const berichtPatroon = /^\[(\d{2}-\d{2}-\d{4}),\s(\d{2}:\d{2}:\d{2})\]\s([^:]+):\s/;

            let berichten = [], personenSet = new Set(), datumsSet = new Set(), huidigBericht = null;
            const negeer = ["toegevoegd", "gewijzigd", "gemaakt", "versleuteld", "beheerder"];

            regels.forEach(regel => {
                const schoon = regel.replace(/[\u200e\ufeff]/g, '');
                const match = schoon.match(berichtPatroon);

                if (match) {
                    if (huidigBericht) berichten.push(huidigBericht);
                    const datum = match[1], tijd = match[2];
                    let ruweNaam = match[3].replace('~', '').trim();
                    
                    // Vertaal naam via naam_mappings.json
                    const persoon = naamMappings[ruweNaam] || ruweNaam;

                    if (negeer.some(s => schoon.includes(s))) { huidigBericht = null; return; }
                    const tekst = schoon.substring(match[0].length).trim();

                    personenSet.add(persoon); datumsSet.add(datum);
                    huidigBericht = { datum, tijd, persoon, tekst };
                } else if (huidigBericht) {
                    huidigBericht.tekst += "\n" + schoon.trim();
                }
            });
            if (huidigBericht) berichten.push(huidigBericht);

            const personen = Array.from(personenSet).sort();

            // Initieer lege status objecten als speler nog niet in spelers_status.json staat
            personen.forEach(p => {
                if (!spelersStatus[p]) {
                    spelersStatus[p] = { status: "levend", rol: "Onbekend", onthuld: false };
                }
            });

            berichten.forEach(b => {
                const t = b.tekst.toLowerCase();
                b.is_stem = t.includes("ik stem") || t.includes("stem op") || personen.some(p => new RegExp('\\bstem ' + p.toLowerCase() + '\\b').test(t));
            });

            globalChatData = { berichten, personen, datums: Array.from(datumsSet) };
            
            const datumSelect = document.getElementById('datumSelect');
            datumSelect.innerHTML = '<option value="alle">Alle Dagen</option>';
            globalChatData.datums.forEach(d => datumSelect.innerHTML += `<option value="${d}">${d}</option>`);

            renderSpelersTabel();
            renderPersonenLijst();
            renderChatData();
        }

        function renderPersonenLijst() {
            const container = document.getElementById('personenLijst');
            document.getElementById('ledenAantal').innerText = globalChatData.personen.length;
            
            container.innerHTML = globalChatData.personen.map(p => {
                const st = spelersStatus[p] || {};
                const isDood = st.status === "dood";
                const rolTekst = st.onthuld ? ` [${st.rol}]` : '';
                return `
                <label style="display:block; margin-bottom:6px; font-size:0.85rem; ${isDood ? 'opacity:0.5; text-decoration:line-through;' : ''}">
                    <input type="checkbox" value="${p}" checked onchange="renderChatData()" class="persoon-check" data-naam="${p}"> 
                    ${p}${rolTekst} ${isDood ? '(Dood)' : ''}
                </label>`;
            }).join('');
        }

        function renderSpelersTabel() {
            const tbody = document.getElementById('spelerTabelBody');
            tbody.innerHTML = globalChatData.personen.map(p => {
                const st = spelersStatus[p] || { status: 'levend', rol: 'Onbekend', onthuld: false };
                const isLevend = st.status === "levend";

                return `
                <tr>
                    <td><b>${p}</b></td>
                    <td class="${isLevend ? 'status-levend' : 'status-dood'}">${st.status.toUpperCase()}</td>
                    <td>
                        <input type="text" value="${st.rol}" style="width:100px;" onchange="updateRol('${p}', this.value)">
                    </td>
                    <td>
                        <input type="checkbox" ${st.onthuld ? 'checked' : ''} onchange="updateOnthuld('${p}', this.checked)"> Onthuld
                    </td>
                    <td>
                        <button class="btn-small" onclick="wisselStatus('${p}')">
                            Markeer ${isLevend ? 'Dood' : 'Levend'}
                        </button>
                    </td>
                </tr>`;
            }).join('');
        }

        function wisselStatus(p) {
            spelersStatus[p].status = spelersStatus[p].status === "levend" ? "dood" : "levend";
            herlaadInterface();
        }

        function updateRol(p, rol) {
            spelersStatus[p].rol = rol;
            herlaadInterface();
        }

        function updateOnthuld(p, onthuld) {
            spelersStatus[p].onthuld = onthuld;
            herlaadInterface();
        }

        function herlaadInterface() {
            renderSpelersTabel();
            renderPersonenLijst();
            renderChatData();
        }

        function selecteerAlleenLevend() {
            document.querySelectorAll('.persoon-check').forEach(cb => {
                const naam = cb.getAttribute('data-naam');
                cb.checked = (spelersStatus[naam]?.status === "levend");
            });
            renderChatData();
        }

        function renderChatData() {
            const modus = document.getElementById('modusSelect').value;
            const zoekterm = document.getElementById('zoekBalk').value.toLowerCase();
            const gekozenDatum = document.getElementById('datumSelect').value;
            const gecheckt = Array.from(document.querySelectorAll('.persoon-check:checked')).map(c => c.value);

            const gefilterd = globalChatData.berichten.filter(b => 
                gecheckt.includes(b.persoon) &&
                (gekozenDatum === 'alle' || b.datum === gekozenDatum) &&
                (!zoekterm || b.tekst.toLowerCase().includes(zoekterm))
            );

            // Aantallen
            const aantallen = {};
            gefilterd.forEach(b => aantallen[b.persoon] = (aantallen[b.persoon] || 0) + 1);
            document.getElementById('aantalBerichtenLijst').innerHTML = Object.entries(aantallen)
                .sort((a,b) => b[1] - a[1])
                .map(([p, count]) => `<div style="font-size:0.85rem; margin-bottom:4px;">• ${p}: <b>${count}</b></div>`).join('') || '<small>(Geen data)</small>';

            // Berichten
            const resContainer = document.getElementById('resultatenLijst');
            const teTonen = modus === 'stemmen' ? gefilterd.filter(b => b.is_stem) : gefilterd;
            
            resContainer.innerHTML = teTonen.map(b => `
                <div class="msg-item">
                    <small>[${b.datum} ${b.tijd.substring(0,5)}]</small> <b>${b.persoon}</b> ${b.is_stem ? '<span class="stem-tag">[STEM]</span>' : ''}:<br>${b.tekst}
                </div>
            `).join('') || '<small>(Geen resultaten)</small>';
        }

        // Exporteer knop om spelers_status.json direct te kopiëren/downloaden
        function exporteerStatusJSON() {
            const jsonStr = JSON.stringify(spelersStatus, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "spelers_status.json";
            a.click();
        }

        initCourantDirectory();
        initData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wakkerdam - Chatanalyse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay">
        <header>
            <h1>Wakkerdam Archief</h1>
            <nav>
                <a href="couranten.html" class="nav-btn">Dagelijkse Courant</a>
                <a href="index.html" class="nav-btn active">Chatgegevens</a>
                <a href="spelers.html" class="nav-btn">Spelerlijst</a>
            </nav>
        </header>

        <main>
            <section class="page-content">
                <h2>Chatanalyse</h2>
                <div class="chat-controls">
                    <select id="modusSelect" onchange="renderChatData()">
                        <option value="berichten" selected>Alle Berichten</option>
                        <option value="stemmen">Alle Stemmen</option>
                    </select>
                    <input type="text" id="zoekBalk" placeholder="Zoek in berichten..." oninput="renderChatData()">
                    <select id="datumSelect" onchange="renderChatData()">
                        <option value="alle">Alle Dagen</option>
                    </select>

                    <div class="time-filter">
                        <label>Van:</label>
                        <input type="time" id="tijdVan" value="00:00" onchange="renderChatData()">
                        <label>Tot:</label>
                        <input type="time" id="tijdTot" value="23:59" onchange="renderChatData()">
                    </div>

                    <span id="chatStatus" style="margin-left: auto; color: var(--text-muted);">Laden...</span>
                </div>

                <div class="grid">
                    <div class="panel">
                        <h3>Personen (<span id="ledenAantal">0</span>)</h3>
                        <div class="scrollable" id="personenLijst"></div>
                    </div>
                    <div class="panel">
                        <h3>Aantal Berichten</h3>
                        <div class="scrollable" id="aantalBerichtenLijst"></div>
                    </div>
                    <div class="panel">
                        <h3 id="resultaatTitel">RESULTATEN</h3>
                        <div class="scrollable" id="resultatenLijst"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="chat.js"></script>
</body>
</html>
